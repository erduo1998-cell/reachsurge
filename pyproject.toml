[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reachsurge"
version = "0.1.0"
description = "An MCP server that turns an AI agent into a B2B lead-generation pipeline: multi-source prospect discovery, email enrichment waterfall, and per-tenant CRM storage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "erduo1998-cell" },
]
keywords = ["mcp", "lead-generation", "b2b", "prospecting", "email-enrichment", "cold-outreach", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.29,<2",
    "httpx>=0.27,<1",
    "requests>=2.31,<3",
    "dnspython>=2.4,<3",
    "cryptography>=50,<51",
    "python-dotenv>=1,<2",
    "platformdirs>=4,<5",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
browser = ["playwright>=1.40,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
reachsurge-mcp = "mcp_server:run"

[project.urls]
Homepage = "https://github.com/erduo1998-cell/reachsurge"
Repository = "https://github.com/erduo1998-cell/reachsurge"
Issues = "https://github.com/erduo1998-cell/reachsurge/issues"

[tool.setuptools]
py-modules = ["mcp_server", "registry", "keypool", "security"]

[tool.setuptools.packages.find]
include = ["sources*", "storage*", "tools*"]
exclude = ["data*", "last30days*"]
namespaces = false
