[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reachsurge"
version = "0.1.0"
description = "An MCP server that turns an AI agent into a B2B lead-generation pipeline: multi-source prospect discovery, email enrichment waterfall, and per-tenant CRM storage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "erduo1998-cell" },
]
keywords = ["mcp", "lead-generation", "b2b", "prospecting", "email-enrichment", "cold-outreach", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "requests>=2.31",
    "dnspython>=2.4",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/erduo1998-cell/reachsurge"
Repository = "https://github.com/erduo1998-cell/reachsurge"
Issues = "https://github.com/erduo1998-cell/reachsurge/issues"

[tool.setuptools]
py-modules = ["mcp_server", "registry", "keypool"]

[tool.setuptools.packages.find]
include = ["sources*", "storage*", "tools*"]
exclude = ["data*", "last30days*"]
