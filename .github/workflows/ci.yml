name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m compileall -q .
      - if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python -m pip install build
      - if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python -m build --wheel
      - if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/wheel-smoke/bin/python" -c "import mcp_server, onboarding, security; from pathlib import Path; assert len(mcp_server.TOOLS) == 22; assert Path(onboarding._installed_asset('docs/FIRST_RUN_GUIDE.zh-CN.md')).is_file(); assert Path(onboarding._installed_asset('.env.example')).is_file()"
